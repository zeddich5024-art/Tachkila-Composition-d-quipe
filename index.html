<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TACHKILA</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="Tachkila.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="Tachkila.css">
</head>
<body class="overflow-hidden">
    <header class=" bg-slate-700 flex justify-between align-center pt-3 pb-3 pl-5 pr-5 items-center border-b-1 border-gray-100  ">
        <div class="flex gap-2 items-center">
        <img src="club.png" class="w-8" alt="Écusson Atlas FC Vert et Blanc"> 
        <h4 class="text-gray-100 font-medium text-xl">TACHKILA</h4>
        </div>
        <nav>
            <ul class="flex list-disc gap-10 text-xl font-medium items-end ">
                <li class="text-orange-500 "><span class="text-base ">GB</span></li>
                <li class="text-blue-500"><span class="text-base">DEF</span></li>
                <li class="text-green-500"><span class="text-base">MIL</span></li>
                <li class="text-red-500"><span class="text-base ">ATT</span></li>
            </ul>
        </nav>
        <p class="text-sm text-gray-500 font-medium ">Schéma <span class="bg-slate-900 pr-2 pl-2 pt-1 pb-1 text-gray-100 rounded-lg shadow-xl border border-gray-500"> 4-4-2</span></p>
    </header>
    <main class="flex">
        <aside class="bg-slate-700 w-90 h-133 border-r-1 border-gray-100">
            <button class="ajouter cursor-pointer bg-green-700 w-85 m-2 mt-6 p-2 rounded-lg font-medium text-gray-50">+Ajouter un joueur</button>
            <div class="flex justify-between m-2 mt-7">
                <p class="font-medium text-gray-50 ">Effectif</p>
                
                <p class="bg-slate-400 pt-1 pb-1 pr-4 pl-4 rounded-lg font-medium"><span id="nombre-joueurs">0</span> joueur(s)</p>
            </div >
            <p class="m-3 font-base text-slate-400 ">Cliquez sur un joueur placé pour voir sa case sur le terrain.<span class="text-orange-600"><i class="fa-solid fa-pen"></i></span>pour modifier,<span class="text-black"><i class="fa-solid fa-trash-can"></i></span>pour supprimer</p>
            <div class="m-2 border-1 p-2 border-l-4 border-orange-600 rounded-lg">
                <p id="message-vide" class="pl-6 text-slate-400 font-normal">Aucun joueur pour le moment</p>
                <div id="liste-joueurs" class="overflow-y-auto max-h-70"></div>
            </div>
            <div class="form  absolute top-40 left-90 bg-slate-700 w-96 rounded-lg h-95 p-6 hidden">
                <form  id="form-joueur">
                    <div class="flex justify-between">
                        <p class="text-gray-100 font-medium ">Ajouter un joueur</p>
                        <i class="fa-solid fa-x text-sm text-gray-400 cursor-pointer" id="btnX"></i>
                    </div>
                    <div class="mt-2 mb-4">
                        <label for=""  class="text-gray-400 font-medium text-sm">Nom complet</label>
                        <br>
                        <input type="text" id="nom-joueur" required placeholder=" Ex. Ayoub Mansouri" class="w-70 h-8 rounded-lg text-gray-100 text-base font-normal bg-slate-900 border-1">
                    </div>
                    <p class="text-gray-400 font-medium text-sm">Poste</p>
                    <div class="flex gap-6 flex-wrap mt-2 mb-4">
                        <div>
                            <input type="radio" name="poste"  id="br" class="hidden " value="Gardien" required> 
                            <label for="br" class="bg-slate-900 p-1 pl-3 pr-17 rounded-lg border-1 border-gray-400 text-gray-100 "><span class=" text-orange-500 relative">.</span>Gardien</label>   
                        </div>
                        <div>
                            <input type="radio"  name="poste"  id="Dé" class="hidden" value="Défenseur"> 
                            <label for="Dé" class="bg-slate-900 p-1 pl-3 pr-17 rounded-lg border-1 border-gray-400 text-gray-100 "><span class="text-blue-500">.</span>Défeneur</label>    
                        </div>
                        <div>
                            <input type="radio"  name="poste"  id="Mi" class="hidden" value="Milieu">
                            <label for="Mi" class="bg-slate-900 p-1 pl-3 pr-17 rounded-lg border-1 border-gray-400 text-gray-100 "><span class="text-green-500">.</span>Milieau</label>   
                        </div>
                        <div>
                            <input type="radio" name="poste"  id="Att" class="hidden" value="Attaquant">
                            <label for="Att" class="bg-slate-900 p-1 pl-3 pr-17 rounded-lg border-1 border-gray-400 text-gray-100 "><span class="text-red-500">.</span>Attaquant</label>     
                        </div>
                   
                    </div>
                    <p class="text-gray-400 font-medium text-sm mb-3">Numéro(1à99)</p>
                    <input type="number"  id="numero-joueur" min="1" max="99" required class="w-70 h-8 rounded-lg text-gray-100 text-base font-normal bg-slate-900 border-1">
                    <div class="absolute right-4 bottom-4">
                        <button type="button" id="annuler"  class="bg-slate-400 rounded-lg w-20 border-1 border-gray-200 p-1 cursor-pointer">Annuler</button>
                        <button type="submit" class="bg-green-500 rounded-lg w-20 p-1 border-1 border-gray-200 cursor-pointer">Ajouter</button>
                    </div>

                    
            </form>
            </div>
        </aside>
        <section class="bg-slate-950 min-w-228 ">
            <div class="terrain ">
                <div class="position-joueur">
                    <div class="GB border-2 border-dashed border-orange-500 rounded-full bg-orange-500/30 flex"><span class="self-center">GB</span></div>
                    <div class="DG border-2 border-dashed border-blue-500 rounded-lg bg-blue-500/30  ">DG</div>
                    <div class="DC1 border-2 border-dashed border-blue-500 rounded-lg bg-blue-500/30 ">DC</div>
                    <div class="DC2 border-2 border-dashed border-blue-500 rounded-lg bg-blue-500/30  ">DC</div>
                    <div class="DD border-2 border-dashed border-blue-500 rounded-lg bg-blue-500/30 ">DD</div>
                    <div class="MG border-2 border-dashed border-green-500 rounded-lg bg-green-500/30 ">MG</div>
                    <div class="MC1 border-2 border-dashed border-green-500 rounded-lg bg-green-500/30">MC</div>
                    <div class="MC2 border-2 border-dashed border-green-500 rounded-lg bg-green-500/30">MC</div>
                    <div class="MD border-2 border-dashed border-green-500 rounded-lg bg-green-500/30">MD</div>
                    <div class="BU1 border-2 border-dashed border-red-500 rounded-lg bg-red-500/30">BU</div>
                    <div class="BU2 border-2 border-dashed border-red-500 rounded-lg bg-red-500/30">BU</div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
